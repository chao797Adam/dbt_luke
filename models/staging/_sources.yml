version: 2

sources:
  - name: raw_sources
    database: dbt_luke
    schema: raw
    tables:
      - name: job_postings
        description: "Raw job postings data ingested from Parquet files."
        columns:
          - name: job_id
            description: "Unique identifier for each job posting."
            data_tests:
              - unique:
                  config:
                    severity: warn
              - not_null:
                  config:
                    severity: warn

        