
version: 2

sources:
  - name: raw_sources
    database: dbt_luke
    schema: raw

    tables:
      - name: job_postings
        description: "Raw job postings data ingested from Parquet files."
        columns:
          - name: job_id
            data_tests:
              - unique:
                  config:
                    severity: warn
              - not_null:
                  config:
                    severity: warn

      - name: raw_job_skills
        description: "Raw job skills associated with job postings."
        columns:
          - name: job_id
            data_tests:
              - not_null:
                  config:
                    severity: warn

          - name: skill_id
            data_tests:
              - not_null:
                  config:
                    severity: warn
